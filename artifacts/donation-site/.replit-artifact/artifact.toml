kind = "web"
previewPath = "/template"
title = "Donation Site Template"
version = "1.0.0"
id = "artifacts/donation-site"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/template" ]
localPort = 21957

[services.development]
run = "pnpm --filter @workspace/donation-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/donation-site", "run", "build" ]
publicDir = "artifacts/donation-site/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21957"
BASE_PATH = "/template/"
